schema_version: 1

context:
  name: redis-server
  version: "8.10.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/redis/redis/releases/download/${{ version }}/redis-full.tar.gz
  sha256: ae6973de9b6ad8e6cf21b1e764abccab59200689af6aabce10d4cf6bbb2e253f

build:
  number: 1
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler("cxx") }}
    - make
    # for built-in modules
    - cmake
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    # redisearch's src/CMakeLists.txt runs gen_command_info.py; readies' mk/main additionally
    # gates the whole Makefile on `python3 -m pip --version`, so pip (not just python) is needed
    - pip
    # redistimeseries' bundled libevent ships no configure; its autogen.sh needs autoreconf
    - autoconf
    - automake
    - libtool
    # bindgen needs both libclang.so and clang's builtin headers, at one major version
    - clang
    - libclang
  host:
    - openssl
    # redisearch's src/geometry and src/util/hash both do find_package(Boost REQUIRED); header-only parts only
    - libboost-headers

tests:
  - script:
      - redis-cli --version
      - redis-server --version
      - (redis-server "${PREFIX}/etc/redis.conf" --port 0 || true) | tee redis.log; grep -q "to not listen anywhere" redis.log
  - package_contents:
      files:
        - lib/redis/modules/redisbloom.so
        - lib/redis/modules/redisearch.so
        - lib/redis/modules/redistimeseries.so
        - lib/redis/modules/rejson.so

about:
  license: SSPL-1.0 OR LicenseRef-RSALv2 OR AGPL-3.0-only
  license_file:
    - LICENSE.txt
    - THIRDPARTY-redisjson.yml
    - THIRDPARTY-redisearch.yml
  summary: Advanced key-value cache and store
  description: |
    Redis is an in-memory database that persists on disk. The data model
    is key-value, but many different kind of values are supported: Strings,
    Lists, Sets, Sorted Sets, Hashes, Streams, HyperLogLogs, Bitmaps.
  homepage: https://redis.io/
  repository: https://github.com/redis/redis
  documentation: https://redis.io/

extra:
  recipe-maintainers:
    - xhochy
    - SimonBoothroyd
    - XhstormR
